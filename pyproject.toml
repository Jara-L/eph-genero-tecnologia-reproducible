[project]
name = "eph-genero-tecnologia"
version = "0.1.0"
description = "Investigación reproducible sobre género y tecnología en el mercado laboral argentino"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "patsy",
    "scikit-learn",
    "scipy",
    "statsmodels",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eph_genero_tecnologia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
